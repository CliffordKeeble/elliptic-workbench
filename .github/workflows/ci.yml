name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build elliptic-workbench.slnx --configuration Release

      - name: Acceptance harness (exit 0 iff all checks pass)
        run: dotnet run --project app/Elliptic.Bsd.Acceptance --configuration Release --no-build

      - name: Tests
        run: dotnet test tests/Elliptic.Bsd.Tests --configuration Release --no-build
