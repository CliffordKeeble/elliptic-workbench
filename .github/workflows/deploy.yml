name: deploy

on:
  workflow_dispatch:
  # push trigger added in a follow-up commit, once a manual run is green:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'index.html'
  #     - '404.html'
  #     - 'web/**'
  #     - 'data/bsd-rank0.json'
  #     - 'wrangler.jsonc'
  #     - 'tools/build-site.sh'
  #     - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Build the site
        run: sh tools/build-site.sh

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
